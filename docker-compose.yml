services:
  postgres:
    image: postgres:16-alpine
    container_name: cypher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cypher
      POSTGRES_USER: cypher
      POSTGRES_PASSWORD: cypher
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cypher_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cypher -d cypher"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Upstream stopped publishing minio/minio and minio/mc images (removed from
    # Docker Hub and quay.io). pgsty/* is the community-maintained, drop-in fork
    # (same binaries and CLI), multi-arch. Pinned so CI and the Pi run the same
    # version; bump the tags deliberately.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: cypher-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - cypher_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    container_name: cypher-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-cypher-media};
      mc anonymous set none local/${S3_BUCKET:-cypher-media};
      exit 0;
      "

volumes:
  cypher_postgres_data:
  cypher_minio_data:
